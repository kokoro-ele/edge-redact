[project]
name = "edge-redact-training"
version = "0.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pyarrow>=18",
]

[project.optional-dependencies]
synth = ["anthropic>=1.0"]
train = ["torch>=2.6", "numpy>=2"]
teacher = [
  "torch>=2.6",
  "transformers>=4.48",
  "gliner>=0.2.16",
  "tiktoken>=0.8",
  "sentencepiece>=0.2",
  "protobuf>=5",
]

[tool.uv]
package = false
